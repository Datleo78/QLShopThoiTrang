<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>product-detail</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../icon/themify-icons/themify-icons.css" />
  </head>
  <body>
    <!-- header -->
    <header class="header">
      <!-- logo -->
      <div class="header-logo">
        <img src="../img/logo/logo1.webp" alt="logo" />
      </div>

      <!-- nav -->
      <nav class="header-nav">
        <a href="index.html">Trang chủ</a>
        <a href="#products">Sản phẩm</a>
        <a href="#contact">Liên hệ</a>
      </nav>

      <!-- cart -->
      <div class="auth-cart">
        <a href="#login" class="auth">Đăng ký / Đăng nhập</a>
        <a href="#cart" class="cart">
          <i class="ti-shopping-cart"></i>
          <span id="cart-count">0</span></a
        >
      </div>
    </header>
    <div class="content">
      <div id="product-detail-container">
        <img
          src="../img/product/somi/somi5.webp"
          alt=""
          class="product-detail-img"
        />
        <div class="product-detail-info">
          <h2 class="product-detail-info-name">
            Áo Kiểu Phối Bèo Nhún Nữ Tính FWBL24FH13C
          </h2>
          <p class="product-detail-info-price">500000 VND</p>
          <p class="product-detail-info-size">SIZE: <br /></p>
          <span>S</span>
          <span>M</span>
          <span>L</span>
          <span>XL</span>
          <br />
          <button class="btn-buy-now">Mua ngay</button>
        </div>
      </div>
    </div>
    <script src="../script/script.js"></script>
  </body>
</html>
